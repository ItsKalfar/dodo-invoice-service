services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: dodo
      POSTGRES_PASSWORD: dodo
      POSTGRES_DB: dodo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dodo -d dodo"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgres://dodo:dodo@db:5432/dodo
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: info
      SEED_API_KEY: sk_test_demo123
      PSP_URL: http://psp:8081
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      psp:
        condition: service_started

  # Mock payment processor: same image, different binary, reached over the network.
  psp:
    build: .
    command: ["mock_psp"]
    environment:
      BIND_ADDR: 0.0.0.0:8081
      TIMEOUT_DELAY_SECS: "30"
      RUST_LOG: info
    ports:
      - "8081:8081"
